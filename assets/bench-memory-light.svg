<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Peak memory by notebook size">
<title>Peak memory by notebook size</title>
<text x="24" y="30" font-size="17" font-weight="600" fill="#0b0b0b">Peak memory by notebook size</text>
<text x="24" y="52" font-size="13" fill="#52514e">nb streams one note at a time, so memory stays flat</text>
<line x1="24" y1="74" x2="42" y2="74" stroke="#a3a29b" stroke-width="2.5" stroke-linecap="round"/>
<text x="48" y="78" font-size="12" fill="#52514e">Notebook file size</text>
<line x1="182.0" y1="74" x2="200.0" y2="74" stroke="#2a78d6" stroke-width="2.5" stroke-linecap="round"/>
<text x="206.0" y="78" font-size="12" fill="#52514e">nb peak memory</text>
<line x1="64" y1="328.0" x2="570" y2="328.0" stroke="#c3c2b7" stroke-width="1"/>
<text x="54" y="332.0" font-size="12" fill="#898781" text-anchor="end" style="font-variant-numeric: tabular-nums">0 MB</text>
<line x1="64" y1="281.6" x2="570" y2="281.6" stroke="#e1e0d9" stroke-width="1"/>
<text x="54" y="285.6" font-size="12" fill="#898781" text-anchor="end" style="font-variant-numeric: tabular-nums">10 MB</text>
<line x1="64" y1="235.2" x2="570" y2="235.2" stroke="#e1e0d9" stroke-width="1"/>
<text x="54" y="239.2" font-size="12" fill="#898781" text-anchor="end" style="font-variant-numeric: tabular-nums">20 MB</text>
<line x1="64" y1="188.8" x2="570" y2="188.8" stroke="#e1e0d9" stroke-width="1"/>
<text x="54" y="192.8" font-size="12" fill="#898781" text-anchor="end" style="font-variant-numeric: tabular-nums">30 MB</text>
<line x1="64" y1="142.4" x2="570" y2="142.4" stroke="#e1e0d9" stroke-width="1"/>
<text x="54" y="146.4" font-size="12" fill="#898781" text-anchor="end" style="font-variant-numeric: tabular-nums">40 MB</text>
<line x1="64" y1="96.0" x2="570" y2="96.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="54" y="100.0" font-size="12" fill="#898781" text-anchor="end" style="font-variant-numeric: tabular-nums">50 MB</text>
<text x="64.0" y="350" font-size="12" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">100</text>
<text x="232.7" y="350" font-size="12" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">1,000</text>
<text x="401.3" y="350" font-size="12" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">10,000</text>
<text x="570.0" y="350" font-size="12" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">100,000</text>
<text x="317.0" y="372" font-size="12" fill="#898781" text-anchor="middle">notes in the notebook</text>
<path d="M64.0,327.8 L232.7,326.0 L401.3,307.9 L570.0,126.9" fill="none" stroke="#a3a29b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="64.0" cy="327.8" r="4" fill="#a3a29b" stroke="#ffffff" stroke-width="2"/>
<circle cx="232.7" cy="326.0" r="4" fill="#a3a29b" stroke="#ffffff" stroke-width="2"/>
<circle cx="401.3" cy="307.9" r="4" fill="#a3a29b" stroke="#ffffff" stroke-width="2"/>
<circle cx="570.0" cy="126.9" r="4" fill="#a3a29b" stroke="#ffffff" stroke-width="2"/>
<text x="582.0" y="130.9" font-size="12" fill="#0b0b0b" font-weight="600">file 43 MB</text>
<path d="M64.0,316.7 L232.7,316.4 L401.3,316.4 L570.0,316.4" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="64.0" cy="316.7" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<circle cx="232.7" cy="316.4" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<circle cx="401.3" cy="316.4" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<circle cx="570.0" cy="316.4" r="4" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<text x="582.0" y="320.4" font-size="12" fill="#0b0b0b" font-weight="600">nb 2.5 MB</text>
